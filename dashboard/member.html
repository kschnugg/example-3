<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoardFlow — My Tasks</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ═══════════════════════════════════════════════
       MEMBER VIEW — additional styles
    ════════════════════════════════════════════════ */

    /* ── LOGIN SCREEN ─────────────────────────────── */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px;
    }
    .login-card {
      background: var(--bg-2);
      border: 1px solid var(--border-strong);
      border-radius: 18px;
      padding: 36px 40px 40px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 32px 80px rgba(0,0,0,.7);
      animation: slideUp .25s ease;
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 28px;
    }
    .login-brand .brand-icon {
      width: 32px; height: 32px;
      background: var(--indigo);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
    }
    .login-brand .brand-name { font-size: 17px; font-weight: 700; }
    .login-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.5px;
      margin-bottom: 6px;
    }
    .login-sub { font-size: 13px; color: var(--text-3); margin-bottom: 22px; }

    .login-search-wrap {
      position: relative;
      margin-bottom: 20px;
    }
    .login-search-icon {
      position: absolute;
      left: 11px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-3);
      pointer-events: none;
    }
    .login-search {
      width: 100%;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-1);
      padding: 9px 11px 9px 34px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: var(--transition);
    }
    .login-search:focus { border-color: var(--indigo); background: var(--bg-4); }

    .member-picker {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .member-pick-card {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
    }
    .member-pick-card:hover {
      border-color: var(--indigo);
      background: var(--indigo-dim);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99,102,241,.2);
    }
    .member-pick-card.hidden { display: none; }
    .pick-name { font-size: 13px; font-weight: 600; color: var(--text-1); }
    .pick-role { font-size: 11px; color: var(--text-3); }
    .avatar.xlg { width: 48px; height: 48px; font-size: 16px; font-weight: 700; }

    .login-no-data {
      background: var(--bg-3);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      color: var(--text-3);
      font-size: 13px;
      margin-top: 8px;
    }
    .login-no-data strong { color: var(--text-2); display: block; margin-bottom: 6px; }

    /* ── MEMBER DASHBOARD ─────────────────────────── */
    .member-app-wrap {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .member-topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 24px;
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0; z-index: 50;
      flex-wrap: wrap;
    }
    .member-topbar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
    }
    .member-topbar-brand .brand-icon {
      width: 26px; height: 26px;
      background: var(--indigo);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
    }
    .topbar-sep { color: var(--text-3); font-weight: 300; }
    .topbar-sub { font-size: 13px; color: var(--text-3); font-weight: 400; }

    .member-topbar-user {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .member-topbar-name { font-size: 13px; font-weight: 500; }
    .member-topbar-role { font-size: 11px; color: var(--text-3); }

    /* ── SYNC BAR ─────────────────────────────────── */
    .member-sync-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 24px;
      background: var(--bg-3);
      border-bottom: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--text-3);
      flex-wrap: wrap;
    }
    .msync-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-3);
      flex-shrink: 0;
      transition: background .3s;
    }
    .msync-dot.ok  { background: var(--green); box-shadow: 0 0 5px var(--green); }
    .msync-dot.warn{ background: var(--orange); }
    .msync-dot.err { background: var(--red); }
    .msync-sep { color: var(--border-strong); }
    .btn-xs {
      background: var(--bg-4);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-2);
      padding: 3px 9px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-xs:hover { border-color: var(--border-strong); color: var(--text-1); }

    /* ── MAIN CONTENT ─────────────────────────────── */
    .member-content {
      flex: 1;
      padding: 24px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* ── STATS ROW ────────────────────────────────── */
    .member-stats-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    .mstat-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .mstat-val  { font-size: 26px; font-weight: 700; line-height: 1; }
    .mstat-lbl  { font-size: 11px; color: var(--text-3); }

    /* ── SECTION ──────────────────────────────────── */
    .msection { display: flex; flex-direction: column; gap: 10px; }
    .msection-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .msection-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-1);
    }
    .msection-count {
      font-size: 12px;
      color: var(--text-3);
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 1px 8px;
    }

    /* ── STATUS TABS ──────────────────────────────── */
    .status-tabs {
      display: flex;
      gap: 4px;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 3px;
      margin-left: auto;
    }
    .stab {
      background: none;
      border: none;
      border-radius: 99px;
      color: var(--text-3);
      padding: 4px 12px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }
    .stab:hover  { color: var(--text-1); }
    .stab.active { background: var(--bg-4); color: var(--text-1); font-weight: 500; }

    /* ── TASK ROW (member view) ───────────────────── */
    .mtask-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      transition: var(--transition);
    }
    .mtask-row:hover { border-color: var(--border-strong); background: var(--bg-3); }
    .mtask-row.done  { opacity: .55; }
    .mtask-row.overdue { border-left: 3px solid var(--red); }

    .mtask-status-btn {
      flex-shrink: 0;
      margin-top: 1px;
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border-strong);
      background: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--text-3);
      transition: var(--transition);
    }
    .mtask-status-btn:hover          { border-color: var(--indigo); color: var(--indigo-light); }
    .mtask-status-btn.status-in-progress { border-color: var(--indigo); color: var(--indigo); }
    .mtask-status-btn.status-review  { border-color: var(--purple); color: var(--purple); }
    .mtask-status-btn.status-done    { border-color: var(--green); background: var(--green); color: #fff; }

    .priority-dot-sm {
      flex-shrink: 0;
      width: 7px; height: 7px;
      border-radius: 50%;
      margin-top: 7px;
    }
    .mtask-body { flex: 1; min-width: 0; }
    .mtask-title {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-1);
      line-height: 1.4;
    }
    .mtask-row.done .mtask-title { text-decoration: line-through; color: var(--text-3); }
    .mtask-desc {
      font-size: 12px;
      color: var(--text-3);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mtask-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .status-cycle-hint {
      font-size: 10px;
      color: var(--text-3);
      margin-top: 4px;
    }

    /* ── NO DATA BANNER ───────────────────────────── */
    .no-data-banner {
      background: var(--bg-3);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
      padding: 28px;
      text-align: center;
    }
    .no-data-banner h3 { font-size: 15px; margin-bottom: 7px; }
    .no-data-banner p  { font-size: 12.5px; color: var(--text-3); margin-bottom: 16px; }

    /* ── RESPONSIVE ───────────────────────────────── */
    @media (max-width: 640px) {
      .member-stats-row { grid-template-columns: repeat(3, 1fr); }
      .login-card { padding: 24px 20px; }
      .member-picker { grid-template-columns: repeat(2, 1fr); }
      .mtask-meta { display: none; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════
     LOGIN SCREEN
════════════════════════════════════════════ -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
      </div>
      <span class="brand-name">BoardFlow</span>
    </div>

    <h2 class="login-title">Who are you?</h2>
    <p class="login-sub">Select your profile to view your tasks</p>

    <div class="login-search-wrap">
      <svg class="login-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="memberSearch" class="login-search" placeholder="Type your name to search…" autocomplete="off" />
    </div>

    <div class="member-picker" id="memberPicker">
      <!-- rendered by member.js -->
    </div>

    <div id="noDataBanner" style="display:none">
      <div class="login-no-data">
        <strong>No task data found</strong>
        Open the team leader's dashboard first — it will seed the shared storage.
        Or import a CSV file directly.
        <br/><br/>
        <label class="btn-secondary" for="loginCsvInput" style="cursor:pointer;display:inline-flex">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Import CSV
        </label>
        <input type="file" id="loginCsvInput" accept=".csv" style="display:none" />
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════
     MEMBER DASHBOARD
════════════════════════════════════════════ -->
<div id="memberDashboard" class="hidden member-app-wrap">

  <!-- TOPBAR -->
  <header class="member-topbar">
    <div class="member-topbar-brand">
      <div class="brand-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
      </div>
      <span>BoardFlow</span>
      <span class="topbar-sep">·</span>
      <span class="topbar-sub">My Tasks</span>
    </div>

    <div class="date-chip" style="font-size:11px" id="memberDateChip">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span id="memberDateText"></span>
    </div>

    <div class="member-topbar-user">
      <div id="headerAvatar"></div>
      <div>
        <div class="member-topbar-name" id="headerName"></div>
        <div class="member-topbar-role" id="headerRole"></div>
      </div>
      <button class="btn-xs" id="logoutBtn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Switch user
      </button>
      <a href="index.html" class="btn-xs">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
    </div>
  </header>

  <!-- SYNC BAR -->
  <div class="member-sync-bar">
    <span class="msync-dot" id="msyncDot"></span>
    <span id="msyncStatus">Loading…</span>
    <span class="msync-sep">|</span>
    <button class="btn-xs" id="refreshBtn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Refresh
    </button>
    <label class="btn-xs" for="memberCsvInput" style="cursor:pointer">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Import CSV
    </label>
    <input type="file" id="memberCsvInput" accept=".csv" style="display:none" />
  </div>

  <!-- CONTENT -->
  <div class="member-content">

    <!-- STATS -->
    <div class="member-stats-row" id="memberStatsRow"></div>

    <!-- TODAY & OVERDUE -->
    <div class="msection" id="todaySection">
      <div class="msection-header">
        <h3 class="msection-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Today &amp; Overdue
        </h3>
        <span class="msection-count" id="todayCountBadge">0</span>
      </div>
      <div id="todayList"></div>
    </div>

    <!-- ALL TASKS -->
    <div class="msection">
      <div class="msection-header">
        <h3 class="msection-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          All My Tasks
        </h3>
        <span class="msection-count" id="allCountBadge">0</span>
        <div class="status-tabs" id="statusTabs">
          <button class="stab active" data-s="all">All</button>
          <button class="stab" data-s="todo">To Do</button>
          <button class="stab" data-s="in-progress">In Progress</button>
          <button class="stab" data-s="review">In Review</button>
          <button class="stab" data-s="done">Done</button>
        </div>
      </div>
      <div id="allTasksList"></div>
    </div>

  </div><!-- /member-content -->
</div><!-- /memberDashboard -->

<!-- TOAST -->
<div class="toast hidden" id="toast">
  <span class="toast-icon" id="toastIcon"></span>
  <span id="toastMsg"></span>
</div>

<script src="member.js"></script>
</body>
</html>
